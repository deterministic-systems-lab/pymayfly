[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pymayfly"
version = "0.1.0"
description = "Identity-Per-Transaction: ephemeral, transaction-scoped credentials for regulated data pipelines"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
  { name = "Tristan McKinnon", email = "tristan@deterministicsystemslab.io" }
]
keywords = [
  "zero-trust",
  "identity",
  "ephemeral-credentials",
  "fedramp",
  "hipaa",
  "data-engineering",
  "security",
  "iam",
  "serverless",
  "mayfly",
  "ipt",
  "identity-per-transaction",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Information Technology",
  "Topic :: Security",
  "Topic :: System :: Distributed Computing",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Typing :: Typed",
]
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
aws = ["boto3>=1.26"]
azure = ["azure-identity>=1.12", "azure-storage-blob>=12.14"]
gcp = ["google-auth>=2.0", "requests>=2.0"]
dev = [
  "pytest>=7.0",
  "pytest-cov>=4.0",
  "ruff>=0.4",
  "mypy>=1.0",
  "moto[s3,sts]>=5.0",
  "azure-identity>=1.12",
  "azure-storage-blob>=12.14",
  "google-auth>=2.0",
  "requests>=2.0",
  "hatchling",
]

[project.urls]
Homepage     = "https://deterministicsystemslab.io"
Repository   = "https://github.com/deterministicsystemslab/pymayfly"
Issues       = "https://github.com/deterministicsystemslab/pymayfly/issues"
Paper        = "https://doi.org/10.36227/techrxiv.174375803.76224567/v1"
Changelog    = "https://github.com/deterministicsystemslab/pymayfly/blob/main/CHANGELOG.md"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts   = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

# google-auth ships py.typed but leaves many public constructors unannotated,
# which trips strict's disallow_untyped_calls. Treat it as untyped (like boto3).
[[tool.mypy.overrides]]
module = ["google.*"]
follow_imports = "skip"

[tool.hatch.build.targets.wheel]
packages = ["pymayfly"]
