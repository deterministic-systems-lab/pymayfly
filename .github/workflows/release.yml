name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check pymayfly tests

      - name: Type check
        run: mypy pymayfly

      - name: Test
        run: pytest tests/unit tests/integration -v --cov=pymayfly --cov-report=term-missing

  build:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      prerelease: ${{ steps.classify.outputs.prerelease }}

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: pip install build twine packaging

      - name: Verify tag matches package version
        run: |
          python - "$GITHUB_REF_NAME" <<'PY'
          import pathlib, sys, tomllib
          from packaging.version import Version

          tag = sys.argv[1].removeprefix("v")
          version = tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"]
          if Version(tag) != Version(version):
              sys.exit(
                  f"Tag {sys.argv[1]!r} (version {tag}) does not match "
                  f"pyproject.toml version {version!r}. Bump the version before tagging."
              )
          print(f"Tag matches pyproject version: {version}")
          PY

      - name: Build sdist and wheel
        run: python -m build

      - name: Check artifacts
        run: twine check dist/*

      - name: Classify release
        id: classify
        run: |
          python - "$GITHUB_REF_NAME" <<'PY' >> "$GITHUB_OUTPUT"
          import sys
          from packaging.version import Version

          v = Version(sys.argv[1].removeprefix("v"))
          print(f"prerelease={'true' if (v.is_prerelease or v.is_devrelease) else 'false'}")
          PY

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish-testpypi:
    needs: build
    if: needs.build.outputs.prerelease == 'true'
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write

    steps:
      - name: Download distribution artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    needs: build
    if: needs.build.outputs.prerelease == 'false'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write

    steps:
      - name: Download distribution artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
